<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<title>NEON PINBALL JS</title>
<style>
  :root{
    --bg:#050714;
    --panel:#0a1030;
    --cyan:#38f6ff;
    --pink:#ff3fbf;
    --violet:#875cff;
    --lime:#b7ff3c;
    --text:#eff7ff;
  }
  *,*::before,*::after{
    box-sizing:border-box;-webkit-tap-highlight-color:transparent;
    -webkit-touch-callout:none;-webkit-user-select:none;-moz-user-select:none;
    user-select:none;-webkit-user-drag:none;touch-action:none
  }
  ::selection{background:transparent;color:inherit}
  ::-moz-selection{background:transparent;color:inherit}
  html,body{height:100%;margin:0;position:fixed;width:100%;
    background:radial-gradient(circle at 50% 10%, #1a1f55 0, #080b20 34%, #02040d 78%);
    color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
    overflow:hidden;overscroll-behavior:none;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  body{display:grid;place-items:center}
  .wrap{
    width:min(100vw,560px); height:min(100dvh,900px);
    padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right))
      max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));
    display:flex; flex-direction:column; gap:8px;
  }
  .hud{
    display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
    padding:8px 12px;border:1px solid #30407a;border-radius:14px;
    background:linear-gradient(180deg,#11183ccc,#070a1ecc);
    box-shadow:0 0 24px #38f6ff22,inset 0 0 18px #875cff18;
    backdrop-filter:blur(8px)
  }
  .logo{font-weight:900;letter-spacing:.12em;font-size:14px;color:var(--cyan);
    text-shadow:0 0 12px #38f6ff}
  .score{text-align:center}
  .score small{display:block;font-size:10px;color:#8ea4d8;letter-spacing:.18em}
  .score strong{display:block;font-size:24px;line-height:1;color:#fff;
    text-shadow:0 0 13px #ff3fbf}
  .balls{text-align:right;font-size:12px;color:#c5d4ff}
  .stage{position:relative;flex:1;min-height:0;border-radius:24px;overflow:hidden;
    border:2px solid #29376e;background:#030616;
    box-shadow:0 0 30px #38f6ff22,0 0 55px #ff3fbf12}
  canvas{width:100%;height:100%;display:block;touch-action:none;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-user-drag:none}
  .hint{
    position:absolute;left:50%;bottom:10px;transform:translateX(-50%);
    white-space:nowrap;font-size:11px;color:#9aace0;background:#040719bb;
    border:1px solid #263566;border-radius:999px;padding:6px 10px;
    pointer-events:none
  }
  .controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;
    padding-bottom:env(safe-area-inset-bottom,0px)}
  button{
    border:1px solid #34437e;background:linear-gradient(180deg,#121a42,#090d25);
    color:#fff;border-radius:14px;padding:13px 8px;font-weight:800;
    letter-spacing:.04em;box-shadow:inset 0 0 15px #ffffff08;
    min-height:48px;cursor:pointer;
    transition:transform .08s ease,opacity .08s ease,filter .08s ease
  }
  button:active{transform:scale(.92);opacity:.88;filter:brightness(1.35)}
  #leftBtn{box-shadow:inset 0 0 18px #38f6ff15}
  #rightBtn{box-shadow:inset 0 0 18px #ff3fbf15}
  #launchBtn{color:var(--lime)}
  .title-layer{
    position:fixed;inset:0;z-index:1000;
    padding:env(safe-area-inset-top) env(safe-area-inset-right)
      env(safe-area-inset-bottom) env(safe-area-inset-left)
  }
  .title-layer.hidden{display:none}
  .wrap.hidden{visibility:hidden;pointer-events:none}
  .title-screen{
    position:absolute;inset:0;display:grid;place-items:start center;
    background:
      linear-gradient(180deg,rgba(2,4,13,.78) 0%,rgba(2,4,13,.28) 32%,rgba(2,4,13,.42) 58%,rgba(2,4,13,.82) 100%),
      url('images/title-bg.webp') center top/cover no-repeat,#050714;
    padding:max(10vh,env(safe-area-inset-top)) 0 0;
    pointer-events:none
  }
  .title-inner{text-align:center;max-width:min(92vw,420px);padding:8px 16px 0;pointer-events:none}
  .title-tag{
    font-size:11px;letter-spacing:.28em;color:#dff7ff;margin:0 0 12px;
    text-shadow:0 1px 8px rgba(0,0,0,.85)
  }
  .title-inner h1{
    margin:0;font-size:clamp(42px,11vw,56px);font-weight:900;line-height:.95;
    letter-spacing:.06em;color:#eaffff;
    text-shadow:0 0 18px #38f6ff,0 0 42px #875cff88,0 2px 12px rgba(0,0,0,.9);
    animation:titlePulse 2.4s ease-in-out infinite
  }
  .title-sub{
    margin:14px 0 0;font-size:13px;color:#f0f6ff;letter-spacing:.12em;
    text-shadow:0 1px 10px rgba(0,0,0,.9)
  }
  .start-btn{
    position:absolute;left:50%;bottom:max(8%,calc(6% + env(safe-area-inset-bottom)));
    transform:translateX(-50%);z-index:2;pointer-events:auto;
    display:inline-block;min-width:220px;min-height:56px;padding:16px 28px;
    border:2px solid #38f6ff;border-radius:999px;
    background:linear-gradient(180deg,rgba(18,26,66,.92),rgba(9,13,37,.95));
    color:var(--lime);font-size:15px;font-weight:900;letter-spacing:.18em;
    box-shadow:0 0 28px #38f6ff55,0 4px 24px rgba(0,0,0,.55),inset 0 0 20px #ffffff08;
    animation:startBlink 1.6s ease-in-out infinite
  }
  .title-hint{
    position:absolute;left:50%;bottom:max(3%,calc(1% + env(safe-area-inset-bottom)));
    transform:translateX(-50%);z-index:2;width:min(92vw,360px);margin:0;
    font-size:11px;color:#e8eeff;letter-spacing:.08em;pointer-events:none;text-align:center;
    text-shadow:0 1px 8px rgba(0,0,0,.9)
  }
  .title-hint.hidden{display:none}
  .mute-btn{
    position:fixed;top:max(10px,env(safe-area-inset-top));right:max(10px,env(safe-area-inset-right));
    z-index:1100;width:44px;height:44px;border-radius:50%;
    border:1px solid #34437e;background:#0a1030cc;color:#fff;font-size:18px;
    display:grid;place-items:center;cursor:pointer;
    box-shadow:0 0 16px #38f6ff22
  }
  @keyframes titlePulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.15)}}
  @keyframes startBlink{0%,100%{opacity:1}50%{opacity:.75}}
  @media(max-height:700px){.hud{padding:5px 10px}.score strong{font-size:19px}.controls button{padding:9px 6px}}

<body>
<div id="titleLayer" class="title-layer">
  <button type="button" id="startBtn" class="start-btn">TAP TO START</button>
  <div id="titleScreen" class="title-screen">
    <div class="title-inner">
      <p class="title-tag">ARCADE // PHYSICS</p>
      <h1>NEON<br>PINBALL</h1>
      <p class="title-sub">サイバーパンク・ピンボール</p>
    </div>
  </div>
  <p id="titleHint" class="title-hint">タップでタイトルBGM開始</p>
</div>
<button type="button" id="muteBtn" class="mute-btn" aria-label="音声切替">🔊</button>

<div class="wrap hidden" id="gameWrap">
  <div class="hud">
    <div class="logo">NEON // PINBALL</div>
    <div class="score"><small>SCORE</small><strong id="score">000000</strong></div>
    <div class="balls">BALL × <span id="balls">3</span></div>
  </div>

  <div class="stage" id="stage">
    <canvas id="game"></canvas>
    <div class="hint">← / → フリッパー　SPACE 発射　R リセット</div>
  </div>

  <div class="controls">
    <button id="leftBtn">◀ LEFT</button>
    <button id="launchBtn">LAUNCH</button>
    <button id="rightBtn">RIGHT ▶</button>
  </div>
</div>

<script>
(() => {
  'use strict';

  let lastTouchEnd = 0;
  document.addEventListener('touchstart', (e) => e.preventDefault(), { passive: false });
  document.addEventListener('touchend', (e) => {
    const now = Date.now();
    if (now - lastTouchEnd <= 300) e.preventDefault();
    lastTouchEnd = now;
  }, { passive: false });
  document.addEventListener('dblclick', (e) => e.preventDefault());
  document.addEventListener('contextmenu', (e) => e.preventDefault());
  document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
  document.addEventListener('selectstart', (e) => e.preventDefault());
  document.addEventListener('dragstart', (e) => e.preventDefault());
  document.addEventListener('gesturestart', (e) => e.preventDefault());

  function tapFeedback(){ if (navigator.vibrate) navigator.vibrate(15); }

  let screen = 'title';
  let titleBgmStarted = false;

  const titleLayer = document.getElementById('titleLayer');
  const startBtn = document.getElementById('startBtn');
  const muteBtn = document.getElementById('muteBtn');
  const titleHint = document.getElementById('titleHint');
  const gameWrap = document.getElementById('gameWrap');

  const BGM = {
    title: Object.assign(new Audio('audio/title-bgm.m4a'), { loop: true, preload: 'auto' }),
    play: Object.assign(new Audio('audio/play-bgm.m4a'), { loop: true, preload: 'auto' }),
    unlocked: false,
    muted: localStorage.getItem('pinball-mute') === '1'
  };

  function applyVolume(){
    const v = BGM.muted ? 0 : 0.72;
    BGM.title.volume = v;
    BGM.play.volume = v;
    muteBtn.textContent = BGM.muted ? '🔇' : '🔊';
  }
  applyVolume();

  let audioCtx = null;
  function getAudioCtx(){
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    return audioCtx;
  }

  function beep(freq, dur, type, gainVal, delay=0){
    if (BGM.muted) return;
    try{
      const c = getAudioCtx();
      const osc = c.createOscillator();
      const gain = c.createGain();
      osc.type = type || 'square';
      osc.frequency.setValueAtTime(freq, c.currentTime + delay);
      osc.connect(gain);
      gain.connect(c.destination);
      const g = gainVal != null ? gainVal : 0.12;
      const t = c.currentTime + delay;
      gain.gain.setValueAtTime(g, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
      osc.start(t);
      osc.stop(t + dur + 0.02);
    }catch(_){}
  }

  let lastBounceSfx = 0;
  let lastFlipPressSfx = 0;
  function canPlaySfx(minGap=0.028){
    if (BGM.muted) return false;
    const c = getAudioCtx();
    const now = c.currentTime;
    if (now - lastBounceSfx < minGap) return false;
    lastBounceSfx = now;
    return true;
  }

  const sfx = {
    launch(){
      beep(140, 0.24, 'sawtooth', 0.20);
      beep(280, 0.10, 'square', 0.16, 0.04);
      beep(520, 0.08, 'square', 0.14, 0.10);
    },
    flipPress(){
      const c = getAudioCtx();
      const now = c.currentTime;
      if (now - lastFlipPressSfx < 0.06) return;
      lastFlipPressSfx = now;
      beep(260, 0.05, 'square', 0.16);
      beep(390, 0.04, 'triangle', 0.10, 0.02);
    },
    flipHit(impact){
      if (!canPlaySfx(0.02)) return;
      const f = 420 + Math.min(280, impact * 0.12);
      beep(f, 0.07, 'square', 0.18);
      beep(f * 1.35, 0.05, 'triangle', 0.12, 0.03);
    },
    bumper(value){
      if (!canPlaySfx(0.04)) return;
      const f = 520 + Math.min(380, value * 0.5);
      beep(f, 0.11, 'square', 0.20);
      beep(f * 1.25, 0.07, 'triangle', 0.14, 0.05);
    },
    post(impact){
      if (!canPlaySfx(0.03)) return;
      beep(740 + Math.min(200, impact * 0.08), 0.08, 'triangle', 0.16);
    },
    wall(impact){
      if (!canPlaySfx(0.025)) return;
      beep(160 + Math.min(240, impact * 0.14), 0.06, 'square', 0.14);
    },
    drain(){
      beep(180, 0.12, 'triangle', 0.14);
      beep(110, 0.22, 'sawtooth', 0.16, 0.08);
    }
  };

  function playGameOverSFX(){
    if (BGM.muted) return;
    beep(330, 0.16, 'square', 0.11, 0);
    beep(262, 0.20, 'square', 0.12, 0.12);
    beep(196, 0.26, 'sawtooth', 0.13, 0.28);
    beep(98, 0.70, 'triangle', 0.15, 0.48);
  }

  function stopPlayBGM(){
    BGM.play.pause();
    BGM.play.currentTime = 0;
  }

  async function unlockAudio(){
    if (BGM.unlocked) return;
    BGM.unlocked = true;
    const ctx = getAudioCtx();
    if (ctx.state === 'suspended') await ctx.resume();
    try{
      const buffer = ctx.createBuffer(1, 1, 22050);
      const source = ctx.createBufferSource();
      source.buffer = buffer;
      source.connect(ctx.destination);
      source.start(0);
    }catch(_){}
    for (const a of [BGM.title, BGM.play]){
      try{
        await a.play();
        a.pause();
        a.currentTime = 0;
      }catch(_){}
    }
  }

  async function startTitleBGM(){
    await unlockAudio();
    if (BGM.muted) return;
    BGM.play.pause();
    BGM.play.currentTime = 0;
    BGM.title.currentTime = 0;
    try{ await BGM.title.play(); }catch(_){}
  }

  async function startPlayBGM(){
    await unlockAudio();
    BGM.title.pause();
    if (BGM.muted) return;
    BGM.play.currentTime = 0;
    try{ await BGM.play.play(); }catch(_){}
  }

  function resumeBGM(){
    if (BGM.muted || !BGM.unlocked) return;
    if (screen === 'play' && gameOver) return;
    const track = screen === 'title' ? BGM.title : BGM.play;
    if (track.paused) track.play().catch(()=>{});
  }

  function beginGame(){
    screen = 'play';
    titleLayer.classList.add('hidden');
    gameWrap.classList.remove('hidden');
    gameWrap.setAttribute('aria-hidden', 'false');
    BGM.title.pause();
    startPlayBGM();
    resetGame();
    tapFeedback();
  }

  async function handleTitleStart(){
    tapFeedback();
    if (!titleBgmStarted){
      titleBgmStarted = true;
      await startTitleBGM();
      startBtn.textContent = 'START GAME';
      titleHint.textContent = 'START GAME でプレイ開始';
      return;
    }
    beginGame();
  }

  startBtn.addEventListener('pointerdown', (e)=>{
    e.preventDefault();
    handleTitleStart();
  });

  muteBtn.addEventListener('pointerdown', (e)=>{
    e.preventDefault();
    tapFeedback();
    BGM.muted = !BGM.muted;
    localStorage.setItem('pinball-mute', BGM.muted ? '1' : '0');
    applyVolume();
    if (!BGM.muted && BGM.unlocked){
      resumeBGM();
    } else {
      BGM.title.pause();
      BGM.play.pause();
    }
  });

  document.addEventListener('visibilitychange', ()=>{
    if (document.visibilityState === 'visible') resumeBGM();
  });

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const stage = document.getElementById('stage');
  const scoreEl = document.getElementById('score');
  const ballsEl = document.getElementById('balls');

  const W = 520, H = 790;
  let dpr = Math.max(1, Math.min(2, devicePixelRatio || 1));

  function resize(){
    const r = stage.getBoundingClientRect();
    canvas.width = Math.round(r.width*dpr);
    canvas.height = Math.round(r.height*dpr);
    canvas.style.width = r.width+'px';
    canvas.style.height = r.height+'px';
    ctx.setTransform(canvas.width/W,0,0,canvas.height/H,0,0);
  }
  addEventListener('resize', resize);
  resize();

  const gravity = 610;
  const BOUNCE_SCALE = 0.8; // 反射速度 20% ダウン
  const FIXED = 1/120;
  let accumulator = 0, last = performance.now();
  const LANE = { left: 430, right: 485, floorY: 660, restX: 458, restY: 650 };

  let score = 0;
  let balls = 3;
  let gameOver = false;
  let launchCharge = 0;
  let charging = false;

  const ball = {
    x: LANE.restX, y: LANE.restY, vx:0, vy:0, r:10,
    active:false, trail:[]
  };

  const bumpers = [
    {x:170,y:210,r:30,color:'#38f6ff',value:250,flash:0},
    {x:340,y:210,r:30,color:'#ff3fbf',value:250,flash:0},
    {x:255,y:325,r:36,color:'#875cff',value:400,flash:0},
    {x:145,y:410,r:25,color:'#b7ff3c',value:200,flash:0},
    {x:365,y:410,r:25,color:'#ffb13b',value:200,flash:0},
  ];

  const posts = [
    {x:100,y:520,r:12},{x:410,y:520,r:12},
    {x:175,y:565,r:10},{x:335,y:565,r:10}
  ];

  const walls = [
    [35,70,35,690],
    [35,70,220,25],
    [220,25,430,60],
    [430,60,485,110],
    [485,110,485,740],
    [35,690,105,715],
    [485,740,415,715],
    [105,715,185,745],
    [415,715,335,745],
    [LANE.left,125,LANE.left,LANE.floorY], // launcher lane divider down to the shelf
    [LANE.left,LANE.floorY,LANE.right,LANE.floorY], // plunger shelf — ball rests here
  ];

  const guides = [
    [70,470,112,535],
    [112,615,150,645],
    [398,615,360,645],
  ];

  const flippers = {
    left:  {px:165,py:665,len:77,angle: 0.27,base:0.27,up:-0.55,pressed:false,omega:0},
    right: {px:355,py:665,len:77,angle:Math.PI-0.27,base:Math.PI-0.27,up:Math.PI+0.55,pressed:false,omega:0}
  };

  function setScore(v){
    score = Math.max(0,Math.floor(v));
    scoreEl.textContent = score.toString().padStart(6,'0');
  }

  function resetBall(){
    // Start the ball resting on top of the launcher spring.
    ball.x=LANE.restX; ball.y=LANE.restY; ball.vx=0; ball.vy=0;
    ball.active=false; ball.trail.length=0; launchCharge=0; charging=false;
  }

  function resetGame(){
    const wasOver = gameOver;
    balls=3; ballsEl.textContent=balls; gameOver=false; setScore(0); resetBall();
    if (wasOver && screen === 'play' && !BGM.muted) startPlayBGM();
  }

  function triggerGameOver(){
    gameOver = true;
    resetBall();
    stopPlayBGM();
    playGameOverSFX();
  }

  function launch(){
    if(gameOver){ resetGame(); return; }
    if(ball.active) return;
    const p = Math.max(0.35, launchCharge || 0.65);
    ball.active=true;
    ball.vx = -18 - Math.random()*18;
    ball.vy = -(690 + p*440);
    launchCharge=0; charging=false;
    unlockAudio();
    sfx.launch();
  }

  function addScore(n){
    setScore(score+n);
  }

  function closestPoint(ax,ay,bx,by,px,py){
    const abx=bx-ax, aby=by-ay;
    const apx=px-ax, apy=py-ay;
    const d=abx*abx+aby*aby || 1;
    const t=Math.max(0,Math.min(1,(apx*abx+apy*aby)/d));
    return {x:ax+abx*t,y:ay+aby*t,t};
  }

  function collideSegment(ax,ay,bx,by,rest=0.83,boost=0){
    rest *= BOUNCE_SCALE;
    boost *= BOUNCE_SCALE;
    const q=closestPoint(ax,ay,bx,by,ball.x,ball.y);
    let dx=ball.x-q.x, dy=ball.y-q.y;
    let dist=Math.hypot(dx,dy);
    if(dist < ball.r+3){
      if(dist<0.001){dx=0;dy=-1;dist=1}
      const nx=dx/dist, ny=dy/dist;
      const pen=ball.r+3-dist;
      ball.x += nx*pen; ball.y += ny*pen;
      const vn=ball.vx*nx+ball.vy*ny;
      if(vn<0){
        ball.vx -= (1+rest)*vn*nx;
        ball.vy -= (1+rest)*vn*ny;
        if(boost){
          ball.vx += nx*boost;
          ball.vy += ny*boost;
        }
        return Math.abs(vn);
      }
    }
    return 0;
  }

  function collideCircle(c, extraBoost=0){
    let dx=ball.x-c.x, dy=ball.y-c.y;
    let d=Math.hypot(dx,dy);
    const min=ball.r+c.r;
    if(d<min){
      if(d<0.001){dx=0;dy=-1;d=1}
      const nx=dx/d, ny=dy/d;
      ball.x += nx*(min-d); ball.y += ny*(min-d);
      const vn=ball.vx*nx+ball.vy*ny;
      const kick = Math.max(0, extraBoost * BOUNCE_SCALE);
      let impact = 0;
      if(vn<0){
        const bounce = 1 + 0.9 * BOUNCE_SCALE;
        ball.vx -= bounce*vn*nx;
        ball.vy -= bounce*vn*ny;
        impact = Math.abs(vn);
      }
      ball.vx += nx*kick;
      ball.vy += ny*kick;
      return impact + kick * 0.35;
    }
    return 0;
  }

  function updateFlipper(f, dt, side){
    const target = f.pressed ? f.up : f.base;
    let diff = target - f.angle;
    while(diff > Math.PI) diff -= Math.PI*2;
    while(diff < -Math.PI) diff += Math.PI*2;

    const prev=f.angle;
    const speed = f.pressed ? 18 : 12;
    f.angle += diff * Math.min(1, speed*dt);
    f.omega = (f.angle-prev)/dt;

    const ex=f.px+Math.cos(f.angle)*f.len;
    const ey=f.py+Math.sin(f.angle)*f.len;
    const q=closestPoint(f.px,f.py,ex,ey,ball.x,ball.y);
    let dx=ball.x-q.x, dy=ball.y-q.y;
    let d=Math.hypot(dx,dy);
    const thickness=10;

    if(d < ball.r+thickness){
      if(d<0.001){dx=0;dy=-1;d=1}
      const nx=dx/d, ny=dy/d;
      ball.x += nx*(ball.r+thickness-d);
      ball.y += ny*(ball.r+thickness-d);

      const rx=q.x-f.px, ry=q.y-f.py;
      const surfVx = -f.omega*ry;
      const surfVy =  f.omega*rx;
      const rvx=ball.vx-surfVx, rvy=ball.vy-surfVy;
      const vn=rvx*nx+rvy*ny;
      if(vn<0){
        const impulse=-(1 + 0.55 * BOUNCE_SCALE)*vn;
        ball.vx += impulse*nx + surfVx*0.28*BOUNCE_SCALE;
        ball.vy += impulse*ny + surfVy*0.28*BOUNCE_SCALE;
        if(f.pressed){
          ball.vx += side*55*BOUNCE_SCALE;
          ball.vy -= 80*BOUNCE_SCALE;
        }
        sfx.flipHit(Math.abs(vn) + (f.pressed ? 120 : 0));
      }
    }
  }

  function recapturePlunger(){
    if(!ball.active) return false;
    const inLane = ball.x > LANE.left && ball.x < LANE.right + ball.r;
    if(!inLane) return false;
    // Failed shot falling back onto the spring, or already slipped under it.
    // Launch vy is strongly negative, so a fresh shot is never recaptured.
    const fallingOntoSpring = ball.y > LANE.restY - 10 && ball.vy >= 0;
    const underSpring = ball.y > LANE.floorY - 4;
    if(fallingOntoSpring || underSpring){
      resetBall();
      return true;
    }
    return false;
  }

  function physics(dt){
    if(screen !== 'play') return;
    if(charging && !ball.active) launchCharge=Math.min(1,launchCharge+dt*0.75);
    bumpers.forEach(b=>b.flash=Math.max(0,b.flash-dt*4));

    if(!ball.active) return;
    if(recapturePlunger()) return;

    ball.vy += gravity*dt;
    ball.vx *= 0.9994;
    ball.vy *= 0.9994;

    const maxSpeed=1450;
    const sp=Math.hypot(ball.vx,ball.vy);
    if(sp>maxSpeed){ball.vx*=maxSpeed/sp;ball.vy*=maxSpeed/sp}

    ball.x += ball.vx*dt;
    ball.y += ball.vy*dt;

    let wallImpact = 0;
    for(const w of walls) wallImpact = Math.max(wallImpact, collideSegment(...w,0.88));
    for(const g of guides) wallImpact = Math.max(wallImpact, collideSegment(...g,0.87,8));
    if (wallImpact > 70) sfx.wall(wallImpact);

    for(const b of bumpers){
      const hit = collideCircle(b,165);
      if(hit > 0){
        b.flash=1;
        addScore(b.value);
        sfx.bumper(b.value);
      }
    }
    for(const p of posts){
      const hit = collideCircle(p,25);
      if(hit > 40) sfx.post(hit);
    }

    updateFlipper(flippers.left,dt,-1);
    updateFlipper(flippers.right,dt,1);

    if(recapturePlunger()) return;

    if(ball.y > H+35){
      balls--;
      ballsEl.textContent=balls;
      sfx.drain();
      if(balls<=0) triggerGameOver();
      else resetBall();
    }

    ball.trail.unshift({x:ball.x,y:ball.y});
    if(ball.trail.length>14) ball.trail.pop();
  }

  function glowLine(ax,ay,bx,by,color,width=5){
    ctx.save();
    ctx.strokeStyle=color;
    ctx.lineWidth=width;
    ctx.lineCap='round';
    ctx.shadowBlur=16; ctx.shadowColor=color;
    ctx.beginPath();ctx.moveTo(ax,ay);ctx.lineTo(bx,by);ctx.stroke();
    ctx.restore();
  }

  function draw(){
    ctx.clearRect(0,0,W,H);

    const bg=ctx.createLinearGradient(0,0,0,H);
    bg.addColorStop(0,'#0b1032');
    bg.addColorStop(.5,'#05091d');
    bg.addColorStop(1,'#02030a');
    ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);

    // grid
    ctx.save();
    ctx.strokeStyle='#1a2454';ctx.lineWidth=1;ctx.globalAlpha=.33;
    for(let x=0;x<W;x+=26){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}
    for(let y=0;y<H;y+=26){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
    ctx.restore();

    // title
    ctx.save();ctx.textAlign='center';
    ctx.font='900 28px system-ui';ctx.fillStyle='#eaffff';
    ctx.shadowBlur=20;ctx.shadowColor='#38f6ff';
    ctx.fillText('NEON PINBALL',260,105);
    ctx.font='600 11px system-ui';ctx.fillStyle='#7e91ca';
    ctx.shadowBlur=0;ctx.fillText('PHYSICS ARCADE // JAVASCRIPT',260,126);
    ctx.restore();

    for(const w of walls) glowLine(...w,'#5570d8',5);
    for(const g of guides) glowLine(...g,'#a057ff',5);
    glowLine(LANE.left,125,LANE.left,LANE.floorY,'#38f6ff',3);
    glowLine(LANE.left,LANE.floorY,LANE.right,LANE.floorY,'#b7ff3c',6);

    // launcher spring
    ctx.save();
    ctx.strokeStyle='#b7ff3c';ctx.lineWidth=3;ctx.shadowBlur=12;ctx.shadowColor='#b7ff3c';
    ctx.beginPath();
    const sy=730, amp=8, turns=9, total=70*(1-launchCharge*.45);
    for(let i=0;i<=turns*2;i++){
      const yy=sy-i*(total/(turns*2));
      const xx=458+(i===0||i===turns*2?0:(i%2?amp:-amp));
      if(i===0)ctx.moveTo(xx,yy);else ctx.lineTo(xx,yy);
    }
    ctx.stroke();ctx.restore();

    // bumpers
    bumpers.forEach(b=>{
      ctx.save();
      ctx.beginPath();ctx.arc(b.x,b.y,b.r+(b.flash*5),0,Math.PI*2);
      ctx.fillStyle=b.flash?'#ffffff':b.color;
      ctx.shadowBlur=24+(b.flash*22);ctx.shadowColor=b.color;ctx.fill();
      ctx.beginPath();ctx.arc(b.x,b.y,b.r-9,0,Math.PI*2);
      ctx.fillStyle='#081027';ctx.fill();
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.font='900 10px system-ui';ctx.fillStyle=b.color;
      ctx.fillText('+'+b.value,b.x,b.y);
      ctx.restore();
    });

    posts.forEach(p=>{
      ctx.save();ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle='#dce6ff';ctx.shadowBlur=14;ctx.shadowColor='#ffffff';ctx.fill();ctx.restore();
    });

    function drawFlipper(f,color){
      const ex=f.px+Math.cos(f.angle)*f.len, ey=f.py+Math.sin(f.angle)*f.len;
      glowLine(f.px,f.py,ex,ey,color,20);
      ctx.save();ctx.fillStyle='#fff';ctx.shadowBlur=18;ctx.shadowColor=color;
      ctx.beginPath();ctx.arc(f.px,f.py,12,0,Math.PI*2);ctx.fill();ctx.restore();
    }
    drawFlipper(flippers.left,'#38f6ff');
    drawFlipper(flippers.right,'#ff3fbf');

    // trail
    ball.trail.forEach((p,i)=>{
      ctx.save();ctx.globalAlpha=(1-i/ball.trail.length)*.22;
      ctx.fillStyle='#6bf7ff';
      ctx.beginPath();ctx.arc(p.x,p.y,Math.max(1,ball.r*(1-i/ball.trail.length)),0,Math.PI*2);ctx.fill();
      ctx.restore();
    });

    // ball
    ctx.save();
    const rg=ctx.createRadialGradient(ball.x-3,ball.y-4,2,ball.x,ball.y,ball.r);
    rg.addColorStop(0,'#fff');rg.addColorStop(.35,'#bffcff');rg.addColorStop(1,'#4098ff');
    ctx.fillStyle=rg;ctx.shadowBlur=18;ctx.shadowColor='#38f6ff';
    ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fill();ctx.restore();

    // charge meter
    if(!ball.active && !gameOver){
      ctx.save();
      ctx.fillStyle='#17214a';ctx.fillRect(443,580,30,6);
      ctx.fillStyle='#b7ff3c';ctx.shadowBlur=8;ctx.shadowColor='#b7ff3c';
      ctx.fillRect(443,580,30*launchCharge,6);
      ctx.restore();
    }

    if(gameOver){
      ctx.save();ctx.fillStyle='#030511cc';ctx.fillRect(55,285,410,150);
      ctx.strokeStyle='#ff3fbf';ctx.lineWidth=2;ctx.strokeRect(55,285,410,150);
      ctx.textAlign='center';ctx.fillStyle='#fff';ctx.shadowBlur=20;ctx.shadowColor='#ff3fbf';
      ctx.font='900 34px system-ui';ctx.fillText('GAME OVER',260,345);
      ctx.shadowBlur=0;ctx.font='600 14px system-ui';ctx.fillStyle='#aebce8';
      ctx.fillText('SPACE / LAUNCH で再スタート',260,385);
      ctx.restore();
    }
  }

  function loop(now){
    const frame=Math.min(.04,(now-last)/1000);
    last=now;accumulator+=frame;
    while(accumulator>=FIXED){physics(FIXED);accumulator-=FIXED}
    draw();requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  function setFlipper(side, on){
    const f = side === 'left' ? flippers.left : flippers.right;
    if (on && !f.pressed) sfx.flipPress();
    f.pressed = on;
  }

  function setKey(code,on){
    if(code==='ArrowLeft') setFlipper('left', on);
    if(code==='ArrowRight') setFlipper('right', on);
  }

  addEventListener('keydown',e=>{
    if(screen === 'title'){
      if(e.code==='Space' || e.code==='Enter'){
        e.preventDefault();
        handleTitleStart();
      }
      return;
    }
    if(['ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
    if(e.code==='ArrowLeft'||e.code==='ArrowRight') setKey(e.code,true);
    if(e.code==='Space'){
      if(!ball.active && !charging){charging=true}
      if(gameOver) launch();
    }
    if(e.code==='KeyR') resetGame();
  },{passive:false});

  addEventListener('keyup',e=>{
    if(screen !== 'play') return;
    if(e.code==='ArrowLeft'||e.code==='ArrowRight') setKey(e.code,false);
    if(e.code==='Space' && charging) launch();
  });

  function holdButton(el,onDown,onUp){
    const down=e=>{e.preventDefault();tapFeedback();onDown();};
    const up=e=>{e.preventDefault();onUp();};
    el.addEventListener('pointerdown',down);
    el.addEventListener('pointerup',up);
    el.addEventListener('pointercancel',up);
    el.addEventListener('pointerleave',e=>{ if(e.buttons) up(e); });
  }
  holdButton(document.getElementById('leftBtn'),
    ()=>{ if(screen!=='play')return; setFlipper('left', true); },
    ()=>flippers.left.pressed=false);
  holdButton(document.getElementById('rightBtn'),
    ()=>{ if(screen!=='play')return; setFlipper('right', true); },
    ()=>flippers.right.pressed=false);
  holdButton(document.getElementById('launchBtn'),
    ()=>{ if(screen!=='play')return; if(!ball.active) charging=true; },
    ()=>{ if(screen!=='play')return; if(charging) launch(); else if(gameOver) launch(); });

  canvas.addEventListener('pointerdown',e=>{
    e.preventDefault();
    if(screen!=='play') return;
    const r=canvas.getBoundingClientRect();
    const x=(e.clientX-r.left)/r.width;
    if(x<.42) setFlipper('left', true);
    else if(x>.58) setFlipper('right', true);
  });
  canvas.addEventListener('pointerup',e=>{
    e.preventDefault();
    flippers.left.pressed=false;flippers.right.pressed=false;
  });

  resetBall();
})();
</script>
</body>
